name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (applied to pluginVersion in gradle.properties)
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      channel:
        description: JetBrains Marketplace channel
        required: true
        default: default
        type: choice
        options: [default, eap, beta]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    # Only the repository owner may release, and only from main.
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Holds the Marketplace secrets (without them the release is only built, not published); add required reviewers
    # to it for a second approval gate.
    environment: marketplace
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # verifyPlugin downloads several full IDEs.
      - uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          large-packages: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Bump version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          current="$(sed -n 's/^pluginVersion *= *//p' gradle.properties)"
          if ! [[ "$current" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::pluginVersion '$current' in gradle.properties is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          major="${BASH_REMATCH[1]}" minor="${BASH_REMATCH[2]}" patch="${BASH_REMATCH[3]}"
          case "$BUMP" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
          esac
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi
          sed -i "s/^pluginVersion *=.*/pluginVersion = $version/" gradle.properties
          ./gradlew :plugin:patchChangelog
          echo "Releasing $current -> $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test and verify
        run: ./gradlew check verifyPlugin

      - name: Check Marketplace credentials
        id: marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          missing=()
          for name in PUBLISH_TOKEN CERTIFICATE_CHAIN PRIVATE_KEY PRIVATE_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} == 0 )); then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif (( ${#missing[@]} == 4 )); then
            echo "::notice::No Marketplace secrets configured; building without publishing"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Incomplete Marketplace secrets, missing: ${missing[*]}"
            exit 1
          fi

      - name: Build, sign and publish
        if: steps.marketplace.outputs.publish == 'true'
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew -PpluginChannel=${{ inputs.channel }} :plugin:publishPlugin

      - name: Build
        if: steps.marketplace.outputs.publish != 'true'
        run: ./gradlew :plugin:buildPlugin

      # The tag marks the tested commit plus the bump; if main moved meanwhile, only the bump is rebased onto it.
      - name: Commit version bump and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release v$VERSION" -- gradle.properties CHANGELOG.md
          git tag "v$VERSION"
          git push origin "v$VERSION"
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PUBLISHED: ${{ steps.marketplace.outputs.publish }}
        run: |
          zip="plugin/build/distributions/Ansibility-$VERSION.zip"
          [[ "$PUBLISHED" == true ]] && zip="plugin/build/distributions/Ansibility-$VERSION-signed.zip"
          ./gradlew -q :plugin:getChangelog --no-header --console=plain > release-notes.md
          gh release create "v$VERSION" \
            --verify-tag \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            ${{ inputs.channel != 'default' && '--prerelease' || '' }} \
            "$zip"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: ansibility-${{ steps.version.outputs.version }}
          path: plugin/build/distributions/*.zip
