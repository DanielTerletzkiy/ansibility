name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Git cannot track the fixtures' synthetic .git files (tools/fixtures/README.md).
      - name: Restore fixture .git links
        run: python3 tools/fixtures/sync.py --links-only

      - name: Fixture tool tests
        run: python3 -m unittest discover -s tools/fixtures -p 'test_*.py'

      - name: Test
        run: ./gradlew check

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            */build/reports/tests/
            */build/test-results/
          retention-days: 14
