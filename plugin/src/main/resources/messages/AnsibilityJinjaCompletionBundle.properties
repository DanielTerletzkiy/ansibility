# Members of Jinja's loop variable and of ansible_loop (loop_control.extended)
loop.member.index=The current iteration, counting from 1.
loop.member.index0=The current iteration, counting from 0.
loop.member.revindex=Iterations until the end, counting down to 1.
loop.member.revindex0=Iterations until the end, counting down to 0.
loop.member.first=True in the first iteration.
loop.member.last=True in the last iteration.
loop.member.length=The number of items.
loop.member.cycle=A helper that cycles through its arguments.
loop.member.depth=Depth of a recursive loop, starting at 1.
loop.member.depth0=Depth of a recursive loop, starting at 0.
loop.member.previtem=The item of the previous iteration (undefined in the first).
loop.member.nextitem=The item of the next iteration (undefined in the last).
loop.member.changed=True when the argument changed since the last call.
loop.member.allitems=Every item of the loop.

