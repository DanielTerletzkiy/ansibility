# Role drift vs the role library (plan amendment R9, F9.5; WU WS3). Always "differs from", never "outdated": the
# direction of a difference is unknown. Avoid apostrophes: messages with parameters go through MessageFormat.

drift.badge.reference=reference
drift.badge.identical=\= {0}
drift.badge.molecule=≈ {0} (molecule only)
drift.badge.spec=Δ spec/defaults
drift.badge.behaviour=Δ tasks/templates
drift.badge.only={0} only
drift.badge.noReference=no {0} copy
drift.badge.pending=…

drift.tooltip.reference=The reference copy in the role library {0}; the other copies are compared with it
drift.tooltip.identical=Byte-identical to {0}
drift.tooltip.molecule=Differs from {0} only below molecule/ (test scenarios)
drift.tooltip.spec=Differs from {0} in meta/argument_specs.yml, defaults/ or vars/ (and possibly molecule/)
drift.tooltip.behaviour=Differs from {0} in tasks/, handlers/, templates/, files/, meta/main.yml or other files
drift.tooltip.noReference=The role library {0} has no copy of this role; only the variants are compared

drift.reference.fallback=golden
