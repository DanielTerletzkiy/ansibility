# Vault area (plan amendment R7/R8, A.13). Texts never contain a password, a plaintext or file content.

# Failures (api.VaultFailure)
failure.locked=The vault id is locked. Unlock it first.
failure.no.identity=No vault id of this root can decrypt this value.
failure.wrong.secret=None of the unlocked vault passwords decrypts this value.
failure.format=The vault value is malformed. Ansible would stop here as well.
failure.unknown.cipher=The vault value names a cipher other than AES256.
failure.source.unavailable=The vault password source could not be read.
failure.not.trusted=Vault password scripts run only in trusted projects and after you confirm each script.
failure.encrypt.identity.required=Several vault ids could encrypt this value. Choose one.
failure.analysis.disabled=Decrypted values are not used for analysis in this root.
failure.cancelled=Cancelled.

