consent.title=Read Vault Passwords
consent.intro=Ansibility found vault password sources in these Ansible roots. Nothing has been read yet.
consent.intro.named=.env.local names a different password file than the one shown before. Nothing has been read from it yet.
consent.intro.changed=This vault password source changed since you allowed Ansibility to read it.
consent.item.env.local=Id {0}: the ANSIBLE_LOCAL_VAULT_PASSWORD_FILE line of {1}, then the password file it names
consent.item.env.local.expected=Id {0}: the ANSIBLE_LOCAL_VAULT_PASSWORD_FILE line of {1}, then the password file it names ({2})
consent.item.file=Id {0}: the password file {1}
consent.item.environment=Id {0}: the environment variable {1}
consent.item.changed={0} (changed since you allowed it)
consent.managers=If you do not allow {0} now, its {1} ids are not read either in this session; Unlock vault ids… asks again.
consent.footer=Only these sources are read, again on each unlock, and never copied. No other line of .env.local is read or kept. Your answer is stored for your user in the IDE settings, never in the project.
consent.use.all=Use for All Listed
consent.choose=Choose…
consent.use.selected=Use Selected
consent.not.now=Not Now

