# Vars-file key completion (plan F4.2): the tail text names the roles that declare the variable.
# {0} is a comma-separated list of role names.
key.tail.roles=\ {0}
# A variable only the roles' defaults/ define (no argument_specs option).
key.tail.defaults=\ {0} (defaults)
# More declaring roles than the tail lists: {0} the listed names, {1} how many more.
key.tail.more={0}, +{1}
# A variable defined only in the root's inventory (group_vars, host_vars, hosts.yml), declared by no role.
key.tail.inventory=\ inventory

# Vars-file value completion (X19): the spec default among the choices.
value.tail.default=\ (default)
# A choice that names an existing template (the key's values are template names of a rendering task).
value.type.template=template
