layer.tooltip.ROLE_DEFAULTS=Level 2: the defaults of a role (defaults/main.yml), the weakest variables. Any inventory, play or task variable overrides them.
layer.tooltip.INVENTORY_FILE_GROUP=Level 3: variables written inline under group {0} in hosts.yml. They apply to every host of the group; every group_vars file (L4–L7) overrides them. The all group comes first, then the other groups in sort_groups order.
layer.tooltip.INVENTORY_GROUP_VARS_ALL=Level 4: group_vars/all next to this environment hosts.yml, values for every host of the environment. The group_vars/all next to the playbook (L5) and every group-specific file (L6, L7) override them.
layer.tooltip.PLAYBOOK_GROUP_VARS_ALL=Level 5: group_vars/all next to the playbook, values for every host of every environment. They override the group_vars/all of each environment (L4); group-specific files (L6, L7) still override them.
layer.tooltip.INVENTORY_GROUP_VARS=Level 6: group_vars/{0} next to this environment hosts.yml, values for the hosts of group {0}. They override group_vars/all (L4, L5). When a host is in several groups, the groups apply in sort_groups order (depth, then ansible_group_priority, then name) and the later group wins.
layer.tooltip.PLAYBOOK_GROUP_VARS=Level 7: group_vars/{0} next to the playbook, values for the hosts of group {0} in every environment. They override every group_vars file of the environment (L4–L6), whatever its group.
layer.tooltip.INVENTORY_FILE_HOST=Level 8: variables written inline for host {0} in hosts.yml. They override every group level (L3–L7).
layer.tooltip.INVENTORY_HOST_VARS=Level 9: host_vars/{0} next to this environment hosts.yml, values for this one host. They override every group level (L3–L7) and the inline host vars (L8).
layer.tooltip.PLAYBOOK_HOST_VARS=Level 10: host_vars/{0} next to the playbook. They override the host_vars of the environment (L9); play, role and task variables (L12 and up) still override them.
layer.tooltip.PLAY_VARS=Level 12: the vars: of a play. They override every inventory level (L3–L10) and facts.
layer.tooltip.VARS_FILES=Level 13: the vars_files and vars_prompt of a play. They override the play vars (L12).
layer.tooltip.ROLE_VARS=Level 14: the vars of a role (vars/main.yml). They override every inventory and play level; only block, task, include_vars, set_fact, role params and extra vars beat them.
layer.tooltip.BLOCK_TASK_VARS=Level 15: vars: of a block or a task, visible inside it only.
layer.tooltip.INCLUDE_VARS=Level 16: variables loaded by include_vars at run time.
layer.tooltip.SET_FACT_REGISTER=Level 17: set_fact and register results, set at run time.
layer.tooltip.ROLE_PARAMS=Level 18: parameters passed to a role (roles: entries, include_role vars).
layer.tooltip.EXTRA_VARS=Level 19: extra vars (-e on the command line), which always win.
layer.tooltip.MOLECULE_INVENTORY=Variables of a molecule scenario inventory (provisioner.inventory, molecule/vars). They only exist in molecule test runs.

