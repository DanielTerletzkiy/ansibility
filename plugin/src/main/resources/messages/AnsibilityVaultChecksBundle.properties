fix.v108.encrypt.file.preview=Encrypts {0} in place with Ansibility Vault (mode 0600); you choose the vault id when the root has several. Ansible''s copy, template and lookup(''file'') decrypt it; other tools see the envelope. Encrypting does not remove the plaintext from git history: rotate a key that was ever committed.
