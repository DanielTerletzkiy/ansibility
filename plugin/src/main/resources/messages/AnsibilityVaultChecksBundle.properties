# Password-free vault checks (plan amendment R7/R8, "R7 diagnostics": ANS-V101-V103; ANS-V113 secret file modes; R21:
# ANS-V107, ANS-V108, ANS-V114) and the Ansible Vault Editor coexistence (F7.12). MessageFormat: write '' for a single quote.
# Messages never carry a value or payload: line numbers, columns and reasons only.
inspection.group.vault=Vault
inspection.v101.display.name=Malformed vault envelope (ANS-V101)
inspection.v102.display.name=Folded or flattened vault value (ANS-V102)
inspection.v103.display.name=Trailing whitespace in a vault value (ANS-V103)
inspection.v113.display.name=Secret written to a file others can read (ANS-V113)
inspection.v107.display.name=Not a whole-file vault (ANS-V107)
inspection.v114.display.name=Vault envelope without the !vault tag (ANS-V114)
inspection.v108.display.name=Plaintext private key (ANS-V108)

inspection.v101.message=Malformed vault envelope: {0}. Ansible fails when it reads this value.
inspection.v101.file.message=Malformed vault file: {0}. Ansible fails when it reads this file.
inspection.v102.folded=Folded vault value: a ''>'' block joins the envelope lines, so Ansible cannot read it. Use a literal block (''|'').
inspection.v102.flattened=Flattened vault value: a {0} scalar holds the envelope on one line, so Ansible cannot read it. Use a literal block (''|'').
inspection.v103.message=Trailing whitespace on line {0} of the vault value: ansible-vault fails with ''Odd-length string''.
style.plain=plain
style.quoted=quoted

reason.empty=the value is empty
reason.no.magic=it does not start with $ANSIBLE_VAULT
reason.leading.whitespace=whitespace or a blank line before $ANSIBLE_VAULT
reason.byte.order.mark=a byte order mark before $ANSIBLE_VAULT
reason.non.ascii=a non-ASCII character
reason.header.fields=the header has fewer than three fields ($ANSIBLE_VAULT;<version>;AES256)
reason.unknown.cipher=unknown cipher ''{0}'' (ansible-vault knows only AES256, case-sensitive)
reason.odd.length=the payload has an odd number of hex digits
reason.non.hex.digit=the payload has a character that is not a hex digit
reason.payload.fields=the payload lacks the salt and HMAC separators
reason.padding=the payload padding is invalid
reason.tab=a TAB in the payload
reason.leading.whitespace.line=whitespace at the start of a payload line

fix.v102.literal=Convert to literal block
fix.v103.strip=Strip trailing whitespace

# ANS-V107 (R21, D159): what Ansible does with the file. {0}/{1} are line numbers or a column count, never content.
inspection.v107.tag=Not a whole-file vault: line {0} is a YAML tag (!vault), so Ansible uses this file as it is: copy, template and lookup(''file'') deliver the envelope text, never the decrypted content. A vault file must start with $ANSIBLE_VAULT; ''ansible-vault encrypt_string'' prints this form for YAML values.
inspection.v107.yaml.value=Not a whole-file vault: line {0} is a YAML key with a !vault value, but Ansible reads this file as it is: copy, template and lookup(''file'') deliver the text, never the decrypted content. A vault file must start with $ANSIBLE_VAULT.
inspection.v107.vars.document=Not a whole-file vault: this file is a single !vault value (line {0}), not a mapping, so Ansible cannot load it as variables (vars_files, include_vars, group_vars and host_vars fail). A vault file must start with $ANSIBLE_VAULT.
inspection.v107.preamble=Not a whole-file vault: {0, choice, 1#1 line comes|1<{0} lines come} before $ANSIBLE_VAULT (line {1}), so Ansible uses this file as it is: copy, template and lookup(''file'') deliver the envelope text, and as a vars file it does not load.
inspection.v107.indented=Not a whole-file vault: the envelope is indented by {0, choice, 1#1 column|1<{0} columns}; Ansible decrypts a file only when $ANSIBLE_VAULT is its first byte, so it uses this file as it is (copy, template and lookup(''file'') deliver the envelope text).
inspection.v107.bom=Not a whole-file vault: a byte order mark comes before $ANSIBLE_VAULT; Ansible decrypts a file only when $ANSIBLE_VAULT is its first byte, so it uses this file as it is. Remove the mark with File | File Properties | Remove BOM.
inspection.v107.quoted=Not a whole-file vault: the envelope on line {0} is quoted, so Ansible uses this file as it is and delivers the quoted envelope text. Keep the envelope in a file of its own, starting with $ANSIBLE_VAULT.
inspection.v107.mixed=Vault envelope inside other text (line {0}): Ansible decrypts only files that start with $ANSIBLE_VAULT, so it uses this file as it is and the envelope text is delivered. Keep the envelope in a file of its own.
inspection.v107.malformed=\ The envelope itself is malformed too: {0}.
fix.v107.convert=Convert to whole-file vault

# ANS-V108 (R21, D160-D162): {0} is a key.format.* or key.name.* text, never content. The VCS status picks the text:
# committed (or no VCS), added (staged), untracked; ignored files get no finding. Texts without a parameter are not
# run through MessageFormat (BundleBase.format), so they use a plain single quote.
inspection.v108.key.committed=Plaintext private key ({0}) in a committed file: everyone with the repository has it. Encrypt it with Ansibility Vault and rotate the key, because git history keeps every committed version.
inspection.v108.key.added=Plaintext private key ({0}) in a file added to version control: encrypt it before you commit. A key that was ever committed must be rotated, because git history keeps it.
inspection.v108.key.untracked=Plaintext private key ({0}), not committed yet: encrypt it before you commit, or .gitignore it.
inspection.v108.key=Plaintext private key ({0}): encrypt it with Ansibility Vault. A key that was ever committed must be rotated, because git history keeps it.
inspection.v108.protected.committed=Passphrase-protected private key ({0}) in a committed file: the passphrase can be attacked offline. Encrypt it with Ansibility Vault, and rotate the key if the passphrase may be weak: git history keeps it.
inspection.v108.protected.added=Passphrase-protected private key ({0}) in a file added to version control: the passphrase can be attacked offline. Encrypt it with Ansibility Vault before you commit.
inspection.v108.protected.untracked=Passphrase-protected private key ({0}), not committed yet: encrypt it before you commit, or .gitignore it.
inspection.v108.protected=Passphrase-protected private key ({0}): the passphrase can be attacked offline. Encrypt it with Ansibility Vault.
inspection.v108.name.committed=Not vaulted: {0} holds a secret by convention, and this committed file is plaintext. Encrypt it with Ansibility Vault; a secret that was ever committed must be rotated, because git history keeps it.
inspection.v108.name.added=Not vaulted: {0} holds a secret by convention, and this file is added to version control in plaintext. Encrypt it with Ansibility Vault before you commit.
inspection.v108.name.untracked=Not vaulted: {0} holds a secret by convention, and this file is plaintext, not committed yet: encrypt it before you commit, or .gitignore it.
inspection.v108.name=Not vaulted: {0} holds a secret by convention, and this file is plaintext. Encrypt it with Ansibility Vault.
inspection.v108.key.committed.outside=Plaintext private key ({0}) in a committed file outside every Ansible root: everyone with the repository has it. Remove it from the repository (and .gitignore it), and rotate the key, because git history keeps every committed version.
inspection.v108.key.outside=Plaintext private key ({0}) outside every Ansible root: keep it out of version control (.gitignore it). A key that was ever committed must be rotated, because git history keeps it.
inspection.v108.protected.committed.outside=Passphrase-protected private key ({0}) in a committed file outside every Ansible root: the passphrase can be attacked offline. Remove it from the repository (and .gitignore it), and rotate the key if the passphrase may be weak: git history keeps it.
inspection.v108.protected.added.outside=Passphrase-protected private key ({0}) in a file added to version control, outside every Ansible root: the passphrase can be attacked offline. Unstage it and .gitignore it before you commit.
inspection.v108.protected.outside=Passphrase-protected private key ({0}) outside every Ansible root: the passphrase can be attacked offline. Keep it out of version control.
inspection.v108.name.committed.outside=Not vaulted: {0} holds a secret by convention, and this committed file outside every Ansible root is plaintext. Remove it from the repository (and .gitignore it); a secret that was ever committed must be rotated, because git history keeps it.
inspection.v108.name.added.outside=Not vaulted: {0} holds a secret by convention, and this file outside every Ansible root is added to version control in plaintext. Unstage it and .gitignore it before you commit.
inspection.v108.name.outside=Not vaulted: {0} holds a secret by convention, and this file outside every Ansible root is plaintext. Keep it out of version control.
inspection.v108.password.committed=This root's vault password file is committed: it unlocks every vault of the root. Remove it from git, .gitignore it and rekey the vaults, because git history keeps the password.
inspection.v108.password.added=This root's vault password file is added to version control: it unlocks every vault of the root. Unstage it and .gitignore it before you commit.
inspection.v108.password.untracked=This root's vault password file is not ignored by git: .gitignore it before you commit, because it unlocks every vault of the root.
