# Find Usages for variables (plan amendment FU, F1.10). Content texts: the variable, its usage groups and the card row
# describe Ansible content, so they carry no "Ansibility:" prefix.

# The search target: the usage view's target node and the type in the dialog ("variable web_port").
# {0} the variable name, {1} the root's display name (falcon, golden) or, for a local, its file name
symbol.variable=Variable {0} · {1}
symbol.member=Member {0} · {1}
symbol.loop=Loop variable {0} · {1}
symbol.local=Template local {0} · {1}
symbol.type=variable

# Usage-type groups of the Find tool window. The platform sorts them by text: reads, then writes, then the other
# owners of a runtime name, then declarations.
usage.read.template=Read: template
usage.read.task=Read: task
usage.read.condition=Read: condition
usage.read.debug.var=Read: debug var
usage.read.value=Read: templated value
usage.read.loop.source=Read: loop source
usage.read.playbook=Read: playbook
usage.read.local=Read: template local
# Reads by name (FU2): a member of hostvars[<host>] (some host's variable) and vars['x'] / lookup('vars', 'x')
usage.read.indirect=Read: through hostvars
usage.read.by.name=Read: by name (vars)
# {0} the environment, or usage.layer.playbook for playbook-level files
usage.set.group.vars=Set: group_vars · {0}
usage.set.host.vars=Set: host_vars · {0}
usage.set.inventory=Set: inventory · {0}
usage.layer.playbook=playbook
usage.set.role.default=Set: role default
usage.set.role.vars=Set: role vars
usage.set.molecule=Set: molecule inventory
usage.set.play.vars=Set: play vars
usage.set.vars.files=Set: vars_files
usage.set.include.vars.file=Set: include_vars file
usage.set.vars.prompt=Set: vars_prompt
usage.set.block.vars=Set: block vars
usage.set.task.vars=Set: task vars
usage.set.include.vars=Set: include_role vars
usage.set.role.params=Set: role params
usage.set.set.fact=Set: set_fact
usage.set.register=Set: register
usage.set.loop=Set: loop
usage.set.loop.var=Set: loop_var
usage.set.index.var=Set: index_var
usage.set.template.vars=Set: template_vars
usage.set.local=Set: template local
usage.spec=Spec: argument spec
# D-FU5: occurrences of a runtime name (register, set_fact, task vars) in another role or playbook; {0} owner.role/owner.file
usage.shared=Shared name · {0}
# {0} the role name
owner.role=role {0}
# {0} the file's path relative to the root
owner.file=playbook {0}

# Highlight Usages in File status text ("Found 3 usages of variable")
highlight.variable=variable

# The card row (D-FU7): "Used in   4 templates · 7 tasks · 2 conditions — Show usages"
card.used.in=Used in
card.show.usages=Show usages
card.count.templates={0,choice,1#1 template|1<{0} templates}
card.count.tasks={0,choice,1#1 task|1<{0} tasks}
card.count.conditions={0,choice,1#1 condition|1<{0} conditions}
card.count.values={0,choice,1#1 variable value|1<{0} variable values}
# {0} the root's display name
card.count.none=no uses in {0}
# R20/D155: uses in Molecule files a card outside Molecule leaves out while "Show Molecule in navigation and search" is off
# Every read counts once (a template's reads too), so the unit is "use".
card.count.molecule.hidden={0,choice,1#1 use|1<{0} uses} in Molecule files (hidden)
# The same when no use outside Molecule files remains.
card.count.molecule.only=only in Molecule files ({0,choice,1#1 use|1<{0} uses}, hidden)
