# Workspace scope (plan amendment R9, F9.1; WU WS1). The scope narrows what is listed, never how anything evaluates.
# Messages with parameters go through MessageFormat: write an apostrophe as '' there (and only there).

# Labels of the stored choice (the selector button reads "Scope: <label>")
scope.label.all=All roots
scope.label.current=Current file's root
scope.label.current.root={0} (current file)
scope.label.deleted={0} (deleted)
scope.label.roots.none=No roots chosen
scope.label.roots.more={0} + {1} more

# Why a scope covers less than expected (WorkspaceScope.problem)
scope.problem.matchesNothing=''{0}'' matches no Ansible root
scope.problem.deleted=Scope ''{0}'' was deleted; all roots are shown until you choose again
scope.problem.noAnsibleFile=No Ansible file selected
scope.problem.detachedFile=The selected file is in a detached worktree, which never joins a scope
scope.problem.noRootsChosen=No roots chosen
scope.problem.rootsMissing=Chosen roots not found: {0}

# The toolbar combo
scope.combo.text=Scope: {0}
scope.combo.tooltip=Workspace scope {0}: {1}
scope.combo.tooltip.rule=It narrows what the Ansibility tool window lists; hover, completion, Ctrl+B and inspections stay the same

# WorkspaceScope.searchScope (cross-repo enumeration only)
searchScope.name=Ansibility workspace scope: {0}

# The selector popup
popup.title=Ansibility Workspace Scope
popup.all.secondary={0,choice,0#no roots|1#1 root|1<{0} roots}
popup.current.secondary={0} (follows the editor)
popup.current.secondary.none=no Ansible file selected
popup.group.project=Project scopes
popup.group.other=Other scopes
popup.scope.local={0} (local)
popup.deleted.secondary=deleted; all roots are shown
popup.coverage.computing=…
popup.coverage.none=matches no Ansible root
popup.coverage.partial={0} (partial)
popup.coverage.more={0} + {1} more
popup.chooseRoots=Choose roots…
popup.uncovered=Not covered by a named scope: {0}
popup.editScopes=Edit Scopes…
popup.openInProjectView=Open in Project View

# Choose roots…
dialog.chooseRoots.title=Choose Roots
dialog.chooseRoots.comment=The Ansibility tool window lists only the chosen roots. A nested playbook root joins with its parent.
dialog.chooseRoots.nested=nested in {0}

# Registered actions (ansibility-workspace.xml)
action.Ansibility.Scope.Combo.text=Ansibility: Workspace Scope
action.Ansibility.Scope.Combo.description=Choose which Ansible roots the Ansibility tool window lists
action.Ansibility.Scope.Switch.text=Ansibility: Switch Scope…
action.Ansibility.Scope.Switch.description=Choose which Ansible roots the Ansibility tool window lists: all roots, the current file's root, a named scope or chosen roots
action.Ansibility.Scope.EditScopes.text=Ansibility: Edit Scopes…
action.Ansibility.Scope.EditScopes.description=Open the Scopes settings (shared .idea/scopes and local scopes)
action.Ansibility.Scope.OpenInProjectView.text=Ansibility: Open Scope in Project View
action.Ansibility.Scope.OpenInProjectView.description=Show the workspace scope in the Project view: the Scope pane for a named scope, the root directory for one root
