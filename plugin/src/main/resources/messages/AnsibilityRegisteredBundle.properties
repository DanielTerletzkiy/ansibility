# Typed register results (plan amendment FU, F1.12; WU RV1): built-in result members, member cards, the
# "Registered result" card rows, completion tails and Ctrl+B targets.
#
# Built-in member texts: member.<text key>.description is Ansible doc markup (C(...) renders as code),
# member.<text key>.returned says when the key is present.

member.common.changed.description=Whether the task changed something on the managed (or delegated) host.
member.common.changed.returned=always
member.common.failed.description=Whether the task failed.
member.common.failed.returned=always
member.common.skipped.description=Whether the task was skipped, e.g. because its C(when) condition was false.
member.common.skipped.returned=when the task was skipped
member.common.msg.description=A message the module or ansible-core passes on to the user, for example why the task failed.
member.common.msg.returned=when the module sets one
member.common.invocation.description=How the module was called: its arguments after defaults were applied (C(module_args)); hidden for C(no_log) tasks.
member.common.invocation.returned=when the module reports it
member.common.invocation.module_args.description=The module arguments after defaults were applied.
member.common.invocation.module_args.returned=when the module reports its invocation
member.common.warnings.description=The warnings the module raised; ansible-core prints them after the task.
member.common.warnings.returned=when the module warns
member.common.deprecations.description=The deprecation notices the module raised.
member.common.deprecations.returned=when the module raises any
member.common.diff.description=What the task changed, as C(before) and C(after) texts (a dictionary or a list of them), for modules that support diff mode.
member.common.diff.returned=in diff mode (C(--diff) or C(diff: true))
member.common.backup_file.description=The path of the backup the module made before it changed the file (O(backup=true)).
member.common.backup_file.returned=when a backup was made

member.loop.results.description=One result per loop item: the module result of that item, plus the item that produced it.
member.loop.results.returned=always, for a looping task
member.loop.msg.description=The summary of the loop, for example C(All items completed).
member.loop.msg.returned=always, for a looping task

member.item.loop_var.description=The loop item this result belongs to, under the name of the loop variable (C(item) unless C(loop_control.loop_var) names another).
member.item.loop_var.returned=always
member.item.ansible_loop_var.description=The name of the loop variable, so the item can be read as C(result[result.ansible_loop_var]).
member.item.ansible_loop_var.returned=always
member.item.index_var.description=The 0-based index of the item in the loop (C(loop_control.index_var)).
member.item.index_var.returned=always
member.item.ansible_index_var.description=The name of the index variable (C(loop_control.index_var)).
member.item.ansible_index_var.returned=always
member.item.ansible_loop.description=Extended information about the iteration (C(loop_control.extended)).
member.item.ansible_loop.returned=always
member.item.ansible_loop.allitems.description=Every item of the loop.
member.item.ansible_loop.index.description=The current iteration of the loop (1-indexed).
member.item.ansible_loop.index0.description=The current iteration of the loop (0-indexed).
member.item.ansible_loop.revindex.description=The number of iterations from the end of the loop (1-indexed).
member.item.ansible_loop.revindex0.description=The number of iterations from the end of the loop (0-indexed).
member.item.ansible_loop.first.description=Whether this is the first iteration.
member.item.ansible_loop.last.description=Whether this is the last iteration.
member.item.ansible_loop.length.description=The number of items in the loop.
member.item.ansible_loop.previtem.description=The item of the previous iteration; undefined during the first one.
member.item.ansible_loop.nextitem.description=The item of the next iteration; undefined during the last one.

member.retry.attempts.description=The number of attempts the task made (C(until) and C(retries)).
member.retry.attempts.returned=when the task retries
member.retry.retries.description=The number of attempts the task was allowed to make.
member.retry.retries.returned=when the task was retried

member.async.ansible_job_id.description=The id of the asynchronous job, for C(ansible.builtin.async_status).
member.async.ansible_job_id.returned=for an asynchronous task
member.async.started.description=Whether the asynchronous job has started.
member.async.started.returned=for an asynchronous task
member.async.finished.description=Whether the asynchronous job has finished.
member.async.finished.returned=for an asynchronous task
member.async.results_file.description=The file on the managed host the asynchronous job writes its result to.
member.async.results_file.returned=for an asynchronous task

member.supplement.uri.json.description=The response body parsed as JSON. The module returns it without documenting it.
member.supplement.uri.json.returned=when the response is JSON
member.supplement.command.rc.description=The exit code of the command (0 means success).
member.supplement.command.rc.returned=always
member.supplement.command.stdout.description=The standard output of the command.
member.supplement.command.stdout.returned=always
member.supplement.command.stderr.description=The standard error of the command.
member.supplement.command.stderr.returned=always

member.derived.stdout_lines.description=C(stdout) split into lines; ansible-core adds it to every result that has C(stdout).
member.derived.stdout_lines.returned=when C(stdout) is returned
member.derived.stderr_lines.description=C(stderr) split into lines; ansible-core adds it to every result that has C(stderr).
member.derived.stderr_lines.returned=when C(stderr) is returned

# What a member is: the grey part of its card header and the completion tail ({0} the module)
kind.module=return value of {0}
kind.supplement=returned by {0} (undocumented)
kind.derived=added by ansible-core
kind.common=common return value
kind.retry=retry information
kind.async=asynchronous job
kind.loop=loop result
kind.loop.item=loop item result
# completion tails ({0} short module names, comma separated)
tail.module={0}
tail.common=common
tail.retry=until
tail.async=async
tail.loop=loop
tail.loop.item=loop item
tail.derived=from ansible-core

# Member card ({0} the number of registering tasks)
card.registered.by.tasks=registered by {0} tasks
card.section.type=Type
card.section.returned=Returned
card.section.sample=Sample
card.section.contains=Contains
card.section.set.by=Set by
card.section.docs=Documentation
# {0} the task's name, {1} where it registers (roles/x/tasks/main.yml:52)
card.task.named=task “{0}” ({1})
card.task.unnamed=a task ({0})
# Documentation pages ({0} the module)
card.docs.module={0} docs
card.docs.common=Common return values
card.docs.loops=Registering variables with a loop
card.docs.retry=Retrying a task until a condition is met
card.docs.async=Asynchronous actions and polling
# {0} the module or what documents the member
card.variant.from=From {0}:
card.member.list.more=… and {0} more

# The variable card's rows (CardSection ansibilityRegistered)
section.result.of=Result of
section.result.keys=Result keys
section.result.item.keys=Item keys
section.result.unknown.module=unknown module

# Ctrl+B ({0} the module or page, {1} the member path)
target.module=Open {0} docs: {1}
target.page=Open “{0}” docs: {1}
