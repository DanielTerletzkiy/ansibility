settings.display.name=Ansibility

# Application level
app.group.executables=Executables (all projects)
app.executables.comment=Leave empty to use the project interpreter's bin directory, then the PATH of your login shell.
app.executables.choose=Choose {0}
app.executables.local.target=Guess the target ansible-core from the local install when no root pins one
app.executables.local.target.comment=Runs ansible --version in the background. The guessed version is marked as guessed; Dockerfile pins and the per-root target always win.

app.group.docs=Documentation
docs.web.base=Web docs:
docs.web.base.target=Versioned for the root's target ansible-core (core 2.18 opens Ansible 11)
docs.web.base.latest=Latest
docs.web.base.custom=Custom URL
docs.web.base.custom.url=Custom docs URL:
docs.web.base.custom.url.comment=The base under which the collections pages live, for example an internal mirror of docs.ansible.com/ansible/11/.
docs.module.navigation=Ctrl+B on a module:
docs.module.navigation.web=Open the module's web docs
docs.module.navigation.quick.doc=Show quick documentation
docs.module.navigation.source=Open the module source
docs.background.refresh=Refresh module docs from the local ansible-doc in the background
docs.background.refresh.comment=Runs ansible-doc outside the repository for the modules the project uses (about a second). The bundled 2.18.8 docs stay authoritative for the target version.

app.group.jinja=Jinja
jinja.claim.j2=Open .j2 files inside Ansible roots as Ansible Jinja
jinja.claim.j2.comment=Only files inside Ansible roots are affected. A file type you set on a single file still wins.
jinja.keep.yaml=Keep YAML for .j2 files
jinja.keep.yaml.comment=Leaves .j2 files as YAML (your own file type mapping). Hover, Ctrl+B and completion of variables still work.
jinja.defer.pycharm=Leave .j2 files to PyCharm's Jinja2 support
jinja.defer.pycharm.comment=Only where PyCharm Professional's Jinja2 plugin is installed.
jinja.templates.dir=Treat Jinja-bearing files under roles/<role>/templates as templates
jinja.templates.dir.comment=Files without .j2 are treated as templates only when they contain Jinja; plain files keep their type.
jinja.auto.close=Auto-close Jinja delimiters
jinja.auto.end.tags=Auto-insert end tags (endif, endfor, endblock ...)
jinja.rules.label=Outer language of templates (first matching rule wins):
jinja.rules.comment=A pattern without a slash matches the file name, one with a slash the path inside the root; both without the .j2 suffix. ** matches any directories. Templates no rule matches are plain text.
jinja.rules.reset=Reset rules to the defaults
jinja.rules.column.pattern=Pattern
jinja.rules.column.language=Language ID

app.group.coexistence=Other Ansible plugins
coexist.notifications=Notify once about conflicting Ansible plugins
coexist.hide.completions=Hide other Ansible plugins' completions
coexist.hide.completions.comment=Off: only their duplicates of Ansibility's completions are removed.

# Project level
project.group=This project
project.share=Share the project settings with the team
project.share.comment=Stores them in .idea/ansibility.xml, which you can commit; everyone who opens the project then uses them. Off: they stay in your workspace file.
project.group.roots=Ansible roots
project.roots.comment=Detected roots of this project. Pick the target ansible-core and the strictness per root; the settings below the table apply to the selected root.
project.roots.selected=Selected root:
roots.loading=Detecting Ansible roots...
roots.empty=No Ansible roots in this project
roots.column.root=Root
roots.column.root.tooltip=The root directory; settings are stored under its path relative to the project
roots.column.kind=Kind
roots.column.target=Target ansible-core
roots.column.preset=Strictness
roots.column.collections=Collections
root.kind.project=Project (ansible.cfg)
root.kind.library=Role library
root.kind.nested=Nested playbook directory
root.kind.detached={0}, detached worktree
target.auto=Auto
target.auto.detected=Auto ({0})
target.auto.guessed=Auto ({0}, guessed)
target.auto.unknown=Auto (not detected)
collections.pins=requirements.yml pins
collections.local=Locally installed

preset.documented=Documented types
preset.runtime=Runtime-faithful
preset.strict=Strict
preset.help.documented=<b>Documented types (default):</b> a value whose YAML type differs from its documented type is red, even if ansible-core would convert it. The message says what ansible-core would do, for example that 3.2 for a string option becomes the string 3.2.
preset.help.runtime=<b>Runtime-faithful:</b> red only when ansible-core rejects the value. Values it would convert are yellow.
preset.help.strict=<b>Strict:</b> like Documented types, and conversions on module options (owner: 1000 for a string option) are red too; weak warnings become warnings.

root.toggle.module.coercions=Highlight scalar conversions on module options
root.toggle.module.coercions.comment=Modules convert values such as owner: 1000 for a string option by contract, so they are not highlighted by default. The Strict preset always makes them red. Values a module rejects are always red.
root.toggle.reachable=Red only when a play applies the role
root.toggle.reachable.comment=When on, a mismatch in a role that no play of this root applies is yellow. The message always says whether a play applies the role.
root.toggle.certain.failures=Red for Claude's certain-failure checks
root.toggle.certain.failures.comment=Unresolved tasks_from, src, notify or role targets (ANS-R001), argument_specs errors (ANS-S001) and a bare = value (ANS-T012b) fail every run. When off, they are yellow.
root.docs.mismatch=Unknown module option when the docs are for another version:
docs.mismatch.warning=Warning
docs.mismatch.off=Not highlighted
root.chain.depth=Variable chain depth:
root.chain.depth.comment=How many variable-to-variable references a type check follows through templated values.
root.cfg.group=ansible.cfg overrides
root.cfg.comment=For values your runs set through environment variables rather than ansible.cfg.
root.cfg.precedence.comment=Comma-separated, from: {0}. Empty: as ansible.cfg says.
cfg.from.ansible.cfg=As in ansible.cfg

project.group.paths=Paths
paths.detached=Treat git worktrees and .claude/worktrees copies as detached roots
paths.detached.comment=A detached root works on its own but never appears in the results of other roots.
paths.ignored=Ignored paths:
paths.ignored.comment=One pattern per line, relative to the project directory; ** matches any directories.
paths.molecule=Molecule support (scenario inventories, converge and verify playbooks); when off, molecule directories are ignored completely
paths.schemastore=Turn off SchemaStore validation for task, handler and playbook files Ansibility understands
paths.schemastore.comment=Avoids duplicate warnings. The Argument Specs, Meta and Vars schemas stay on.
