rename.var.error.identifier=''{0}'' is no valid variable name: letters, digits and _, not starting with a digit
rename.var.error.reserved=''{0}'' is a Python or Jinja word
rename.var.refuse.loop=''{0}'' is bound by the loop itself. Set loop_control.loop_var to give it a name, then rename that.
rename.var.refuse.member={0} is a key inside a value; rename the variable instead.
rename.var.refuse.undefined=''{0}'' is defined nowhere in this project (a fact, magic variable or extra var), so there is nothing to rename it with.
rename.var.clash=''{0}'' is already defined in {1} {1,choice,1#place|1<places}. Renaming onto it merges the two variables.
