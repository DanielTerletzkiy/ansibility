# Vault UI (plan amendment R7/R8: F7.1-F7.6, F7.14, X16, X93). Texts never contain a password, a plaintext or ciphertext.

# Intentions (category under Settings > Editor > Intentions: Ansibility > Ansible Vault)
intention.category=Ansibility/Ansible Vault
intention.family=Ansible Vault
intention.reveal=Reveal vault value
intention.reveal.preview=Shows the decrypted value for {0} s in a masked popup. The value is not shown here.
intention.copy=Copy decrypted vault value
intention.copy.preview=Copies the decrypted value to the clipboard and clears it after {0} s. The value is not shown here.
intention.edit=Edit vault value\u2026
intention.edit.preview=Opens the decrypted value in a popup editor and re-encrypts it with the id that decrypts it (header {0}). The value is not shown here.
intention.encrypt=Encrypt value with Ansible Vault
intention.encrypt.preview=Replaces the value of {0} with a !vault | block encrypted with vault id {1}. The value is not shown here.
intention.encrypt.preview.choose=Replaces the value of {0} with a !vault | block. You choose the vault id ({1}). The value is not shown here.
intention.encrypt.preview.history=Encrypting does not remove the old plaintext from git history or Local History: rotate a secret that was ever committed in plaintext.
intention.decrypt=Decrypt to plain value\u2026
intention.decrypt.preview=Writes the decrypted value of {0} into this file as a quoted string, after a confirmation. The value is not shown here.
intention.rekey=Rekey vault value to id\u2026
intention.rekey.preview=Decrypts the value of {0} and encrypts it again with the secret of the vault id you choose. The value is not shown here.
intention.change.id=Change vault id\u2026
intention.change.id.preview=Relabels the value of {0} with the vault id you choose once that id''s secret is verified to decrypt it; otherwise re-encrypts it with that secret. The value is not shown here.

