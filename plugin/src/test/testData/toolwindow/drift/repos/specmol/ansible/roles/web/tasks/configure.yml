---
- name: Write the main config
  ansible.builtin.template:
    src: web.conf.j2
    dest: /etc/web/web.conf
    mode: "0644"
  notify: Restart web

- name: Write the sites
  ansible.builtin.template:
    src: site.conf.j2
    dest: "/etc/web/sites/{{ item }}.conf"
    mode: "0644"
  loop: "{{ web_sites }}"
  notify: Restart web
