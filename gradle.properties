pluginGroup = de.terletzkiy.ansibility
pluginName = Ansibility
pluginVersion = 0.0.4

# Compile target (never the Toolbox-managed local IDE, which updates in place).
platformVersion = 2026.2.3
pluginSinceBuild = 262

# Local IDEs used by the runLocal* tasks: set localPyCharmPath / localWebStormPath in the git-ignored local.properties
# (or in ~/.gradle/gradle.properties).

org.gradle.jvmargs = -Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching = true
org.gradle.parallel = true
kotlin.code.style = official
# The IDE provides the Kotlin stdlib at runtime; never bundle it (IPGP 2.19 default, also applied to :semantics).
kotlin.stdlib.default.dependency = false
