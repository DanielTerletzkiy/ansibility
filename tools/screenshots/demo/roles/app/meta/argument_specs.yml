---
argument_specs:
  main:
    short_description: Deploy the ACME application.
    options:
      app_port:
        type: int
        default: 8080
        description: HTTP port of the application.
      app_workers:
        type: int
        default: 4
        description: Number of worker processes.
      app_release:
        type: str
        required: true
        description: Release to deploy, e.g. C(2.14.0).
      app_user:
        type: str
        required: true
        description: System user that runs the application.
      timezone:
        type: str
        default: Europe/Berlin
        description: Time zone of the service (C(TZ)).
