all:
  vars:
    ansible_user: deploy
    ansible_port: 2222
    shared_key: from-all-inline
  hosts:
    app1:
      ansible_host: 192.0.2.11
    app2:
      ansible_host: "{{ host_ips['app2'] }}"
    db1:
      ansible_host: 192.0.2.21
    lonely:
      ansible_host: 192.0.2.99
web:
  hosts:
    app1:
    app2:
  vars:
    tier: web
database:
  hosts:
    db1:   # the only database host
empty_group:
  hosts:
    # app1:
    # app2:
region:
  children:
    region_eu:
      hosts:
        app1:
      children:
        region_eu_west:
          hosts:
            app2:
          vars:
            zone: eu-west-inline
    region_us:
      hosts:
        app1:
        db1:
cache:
  children:
    database:
  hosts:
